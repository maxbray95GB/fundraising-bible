            .staticrypt-html {
                height: 100%;
            }

            .staticrypt-body {
                height: 100%;
                margin: 0;
            }

            .staticrypt-content {
                min-height: 100%;
                box-sizing: border-box;
                background: #faf8f2;
                font-family: "Saans", "Helvetica Neue", Arial, sans-serif;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
                color: #000;
            }

            .staticrypt-page {
                width: 400px;
                max-width: 90%;
                padding-top: 14vh;
                margin: 0 auto;
                box-sizing: border-box;
            }

            .staticrypt-logo {
                display: block;
                height: 52px;
                width: auto;
                margin: 0 auto 40px;
            }

            .staticrypt-form {
                position: relative;
                z-index: 1;
                margin: 0 auto 100px;
                text-align: center;
            }

            .staticrypt-instructions {
                margin-bottom: 2em;
            }

            .staticrypt-title {
                font-size: 1.4em;
                margin: 0 0 0.6em;
            }

            .staticrypt-instructions p:last-child {
                color: rgba(0, 0, 0, 0.55);
                font-size: 0.95em;
                line-height: 1.5;
                margin: 0;
            }

            .staticrypt-form input[type="password"],
            input[type="text"] {
                background: inherit;
                border: 0;
                box-sizing: border-box;
                font-size: 15px;
                font-family: "Saans", "Helvetica Neue", Arial, sans-serif;
                outline: 0;
                padding: 15px 45px 15px 16px;
                width: 100%;
                color: #000;
            }

            .staticrypt-password-container {
                position: relative;
                outline: 0;
                background: #ffffff;
                border: 1px solid rgba(0, 0, 0, 0.12);
                border-radius: 8px;
                width: 100%;
                margin: 0 0 15px;
                box-sizing: border-box;
            }

            .staticrypt-password-container:focus-within {
                border-color: rgba(0, 0, 0, 0.4);
            }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 18px;
                opacity: 50%;
                padding: 14px;
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                width: 18px;
            }

            .staticrypt-form .staticrypt-decrypt-button {
                outline: 0;
                background: #f8e13d;
                width: 100%;
                border: 0;
                border-radius: 8px;
                padding: 15px;
                color: #000;
                font-size: 15px;
                font-family: "Saans", "Helvetica Neue", Arial, sans-serif;
                cursor: pointer;
                transition: filter 0.15s ease;
            }

            .staticrypt-form .staticrypt-decrypt-button:hover,
            .staticrypt-form .staticrypt-decrypt-button:active,
            .staticrypt-form .staticrypt-decrypt-button:focus {
                background: #f8e13d;
                filter: brightness(95%);
            }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                margin-bottom: 1.2em;
                font-size: 0.9em;
                color: rgba(0, 0, 0, 0.6);
            }

            .staticrypt-remember input[type="checkbox"] {
                transform: scale(1.3);
                margin-right: 0.9em;
                accent-color: #000;
            }

            .hidden {
                display: none !important;
            }

            .staticrypt-spinner-container {
                height: 100%;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #faf8f2;
            }

            .staticrypt-spinner {
                display: inline-block;
                width: 2rem;
                height: 2rem;
                vertical-align: text-bottom;
                border: 0.25em solid rgba(0, 0, 0, 0.4);
                border-right-color: transparent;
                border-radius: 50%;
                animation: spinner-border 0.75s linear infinite;
            }

            @keyframes spinner-border {
                100% {
                    transform: rotate(360deg);
                }
            }

            @media screen and (-webkit-min-device-pixel-ratio: 0) {
                .staticrypt-form input[type="password"],
                input[type="text"] {
                    font-size: 16px;
                }
            }
        </style>
    </head>
